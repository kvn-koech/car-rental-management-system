services:
  # Backend Web Service
  - type: web
    name: car-rental-backend
    env: python
    buildCommand: "cd backend && ./render_build.sh"
    startCommand: "cd backend && gunicorn 'app:create_app()'"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: car-rental-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: "<your-frontend-url-here>" # E.g., https://car-rental-frontend.onrender.com

  # Frontend Static Site
  - type: web
    name: car-rental-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        value: "<your-backend-url-here>" # E.g., https://car-rental-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: car-rental-db
    databaseName: carrental
    user: carrental
